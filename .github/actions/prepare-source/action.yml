name: Prepare private prerelease source
description: Validate preview inputs, checkout the private source, and enforce test-only overrides.
inputs:
  source_repository:
    description: Private source repository from Actions Secrets
    required: true
  source_read_token:
    description: Read-only source token from Actions Secrets
    required: true
  tag:
    description: Immutable private prerelease tag
    required: true
  source_ref:
    description: Optional full commit SHA for reviewed test-only fixes
    required: false
    default: ''
  source_commit:
    description: >-
      Release commit pinned by the workflow's resolve-source job when the private
      repository has no tag with this version. Empty when the tag exists.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Validate private-source configuration and preview tag
      shell: pwsh
      env:
        SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        SOURCE_READ_TOKEN: ${{ inputs.source_read_token }}
        VERSION_TAG: ${{ inputs.tag }}
        TEST_SOURCE_REF: ${{ inputs.source_ref }}
        PINNED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:PINNED_SOURCE_COMMIT) {
          if ($env:PINNED_SOURCE_COMMIT -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'The pinned release commit must be a full commit SHA.'
          }
          # A test-only override is compared against an immutable tag; a release
          # built from a pinned commit has no tag to compare with.
          if ($env:TEST_SOURCE_REF) {
            throw 'A test-only source override requires a version tag in the private source.'
          }
          Write-Output "::add-mask::$($env:PINNED_SOURCE_COMMIT)"
        }
        if ($env:VERSION_TAG -cnotmatch '\Av[0-9]+\.[0-9]+\.[0-9]+-(pre|alpha|beta|rc)\.[0-9]+\z') {
          throw 'A prerelease tag such as v1.0.0-pre.1 is required.'
        }
        if ($env:TEST_SOURCE_REF -and $env:TEST_SOURCE_REF -cnotmatch '\A[0-9a-f]{40}\z') {
          throw 'A test-only source override must be a full commit SHA.'
        }
        if ($env:SOURCE_REPOSITORY -cnotmatch '\A[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+\z' -or
            [string]::IsNullOrWhiteSpace($env:SOURCE_READ_TOKEN)) {
          throw 'Configure SOURCE_REPOSITORY and SOURCE_READ_TOKEN in repository Actions secrets.'
        }
        foreach ($value in @($env:SOURCE_REPOSITORY) + $env:SOURCE_REPOSITORY.Split('/')) {
          Write-Output "::add-mask::$value"
          Write-Output "::add-mask::$($value.ToLowerInvariant())"
        }
    - name: Checkout the private release tag
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: ${{ inputs.source_repository }}
        token: ${{ inputs.source_read_token }}
        ref: ${{ inputs.source_ref || inputs.source_commit || format('refs/tags/{0}', inputs.tag) }}
        path: source
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        submodules: false
        lfs: false
    - name: Verify test-only override leaves release application inputs unchanged
      if: inputs.source_ref != ''
      shell: pwsh
      env:
        SOURCE_READ_TOKEN: ${{ inputs.source_read_token }}
        VERSION_TAG: ${{ inputs.tag }}
      run: |
        $ErrorActionPreference = 'Stop'
        $authorization = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('x-access-token:' + $env:SOURCE_READ_TOKEN))
        Write-Output "::add-mask::$authorization"
        $env:GIT_CONFIG_COUNT = '1'
        $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
        $env:GIT_CONFIG_VALUE_0 = 'AUTHORIZATION: basic ' + $authorization
        $source = Join-Path $env:GITHUB_WORKSPACE 'source'
        $tagRef = 'refs/tags/' + $env:VERSION_TAG + ':refs/tags/release-code'
        & git -C $source fetch --depth=1 --no-tags origin $tagRef
        if ($LASTEXITCODE -ne 0) { throw 'Could not verify the immutable release code tag.' }
        $changed = @(& git -C $source diff --no-renames --name-only refs/tags/release-code HEAD)
        if ($LASTEXITCODE -ne 0) { throw 'Could not compare the release application inputs.' }
        $allowed = @('qt-native/scripts/ci-build-test.ps1', 'qt-native/ci/README.md')
        $reviewedTestConfigurationChanged = $false
        foreach ($path in $changed) {
          if ($path -ceq 'qt-native/CMakeLists.txt') {
            $tagCMakeBlob = & git -C $source rev-parse --verify 'refs/tags/release-code:qt-native/CMakeLists.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify the tagged CMake input.' }
            $overrideCMakeBlob = & git -C $source rev-parse --verify 'HEAD:qt-native/CMakeLists.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify the override CMake input.' }
            # Only the complete reviewed test-budget/cache configurations may
            # replace this exact tagged file; other CMake edits remain denied.
            $reviewedCMakeBlobs = @(
              '66de044c9a73f460e73a0bc6242d1ae933274285'
              '329db8b7fa6e1e6330521a9167acbcef1701479b'
            )
            if ($tagCMakeBlob -cne 'ee81cbf243ea2b975352aac06e3455c34a10211f' -or
                $overrideCMakeBlob -cnotin $reviewedCMakeBlobs) {
              throw 'A CMake override must match an exact reviewed test-budget or cache configuration.'
            }
            $reviewedTestConfigurationChanged = $true
            continue
          }
          if (-not $path.StartsWith('qt-native/tests/', [StringComparison]::Ordinal) -and $path -cnotin $allowed) {
            throw 'A source override may change only the reviewed tests and CI harness files.'
          }
        }
        foreach ($key in @('GIT_CONFIG_COUNT', 'GIT_CONFIG_KEY_0', 'GIT_CONFIG_VALUE_0')) {
          Remove-Item ('Env:' + $key)
        }
        if ($reviewedTestConfigurationChanged) {
          Write-Output 'Release application sources, resources and toolchain inputs match the immutable tag; the only configuration exception is an exact reviewed CMake test-budget or cache configuration.'
        } else {
          Write-Output 'Release application sources, resources, configuration and toolchain inputs match the immutable tag.'
        }
