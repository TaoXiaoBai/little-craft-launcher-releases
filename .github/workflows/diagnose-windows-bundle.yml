name: Diagnose standalone Windows runtime bundle
run-name: Validate standalone Windows bundle only

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact reviewed 40-character private commit SHA containing the native bootstrap'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-windows-bundle
  cancel-in-progress: false

jobs:
  diagnose-bundle-only:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout public diagnostic tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: builder
          persist-credentials: false

      - name: Validate public smoke assertions and private checkout configuration
        shell: pwsh
        env:
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          TEST_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TEST_SOURCE_REF -cnotmatch '\A[0-9a-f]{40}\z' -or
              $env:SOURCE_REPOSITORY -cnotmatch '\A[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+\z' -or
              [string]::IsNullOrWhiteSpace($env:SOURCE_READ_TOKEN)) {
            throw 'A reviewed full source SHA and private source secrets are required.'
          }
          foreach ($value in @($env:SOURCE_REPOSITORY) + $env:SOURCE_REPOSITORY.Split('/')) {
            Write-Output "::add-mask::$value"
            Write-Output "::add-mask::$($value.ToLowerInvariant())"
          }
          pwsh -NoLogo -NoProfile -NonInteractive -File builder/.github/scripts/test_windows_bundle_smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Independent smoke assertions failed.' }

      # This diagnostic deliberately accepts an exact reviewed bootstrap commit.
      # The normal prerelease workflow's immutable source and proof gates remain
      # unchanged; this job emits no proof and cannot publish a release artifact.
      - name: Checkout exact reviewed private bootstrap revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          submodules: false
          lfs: false

      - name: Restore existing pinned public toolchain download bytes
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mcl-ci-archives
          key: windows-2022-native-archives-${{ hashFiles('source/qt-native/ci/toolchain-lock.json') }}

      - name: Compile and exercise standalone bootstrap privately
        shell: pwsh
        env:
          TEST_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-windows-bundle-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          & pwsh -NoLogo -NoProfile -NonInteractive -File builder/.github/scripts/diagnose-windows-bundle.ps1 `
            -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'source') -SourceRef $env:TEST_SOURCE_REF *> (Join-Path $logs 'orchestrator.log')
          if ($LASTEXITCODE -ne 0) {
            Write-Error -ErrorAction Continue 'Standalone bundle diagnostic failed. Raw compiler and application output is retained only in encrypted diagnostics.'
            exit 1
          }
          Write-Output 'Windows standalone bundle CLI, cache, portable profile and GUI checks passed. No release package or coverage proof is produced.'

      - name: Write safe CI summary (windows-bundle)
        id: safe-diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          SAFE_JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          & python builder/.github/scripts/ci_safe_diagnostics.py create `
            --source-root (Join-Path $env:GITHUB_WORKSPACE 'source') `
            --logs-dir (Join-Path $env:RUNNER_TEMP 'private-windows-bundle-logs') `
            --platform windows-bundle --status $env:SAFE_JOB_STATUS `
            --output (Join-Path $env:RUNNER_TEMP 'safe-diagnostics/windows-bundle/summary.json')
          if ($LASTEXITCODE -ne 0) { throw 'Safe diagnostic summary could not be generated. Raw logs remain private.' }

      - name: Retain safe CI summary (windows-bundle)
        if: ${{ always() && steps.safe-diagnostics.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safe-diagnostics-windows-bundle-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safe-diagnostics/windows-bundle/summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Encrypt private diagnostic logs
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-windows-bundle-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          python builder/.github/scripts/encrypt-diagnostics.py `
            --certificate builder/.github/scripts/diagnostics-certificate.pem --logs-dir $logs `
            --output (Join-Path $env:RUNNER_TEMP 'windows-bundle-diagnostic.p7m') --exclude-screenshots
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic encryption failed. No raw files will be uploaded.' }

      - name: Retain encrypted diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-windows-bundle-diagnostic
          path: ${{ runner.temp }}/windows-bundle-diagnostic.p7m
          if-no-files-found: ignore
          retention-days: 3
