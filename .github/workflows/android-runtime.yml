# Builds the LGPL game runtime of the Android client from the public
# android-runtime branch: the pinned upstream Amethyst commit plus patches/.
# No private source and no secrets are used. Manual only.
name: Android runtime
run-name: Build Android game runtime

on:
  workflow_dispatch:
    inputs:
      upload_apk:
        description: 'Upload the runtime debug APK as a 7-day artifact'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: android-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build pinned runtime
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout runtime definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: android-runtime
          path: definition
          persist-credentials: false

      - name: Fetch pinned upstream and apply patches
        run: |
          set -euo pipefail
          . definition/UPSTREAM
          printf '%s' "${UPSTREAM_COMMIT}" | grep -Eq '^[0-9a-f]{40}$'
          git init -q runtime && cd runtime
          git fetch -q --depth 1 "${UPSTREAM_REPOSITORY}" "${UPSTREAM_COMMIT}"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git config user.name runtime-build && git config user.email runtime-build@invalid
          shopt -s nullglob
          for patch in ../definition/patches/*.patch; do git am "${patch}"; done
          echo "Definition: $(git -C ../definition rev-parse HEAD)"

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Get JRE 8 (as upstream CI does)
        uses: dawidd6/action-download-artifact@07ab29fd4a977ae4d2b275087cf67563dfdf0295 # v9
        with:
          workflow: build.yml
          path: runtime/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Build debug runtime
        working-directory: runtime
        run: |
          set -euo pipefail
          ./scripts/languagelist_updater.sh
          # Plain JVM tests of the Little Craft Launcher part of the runtime.
          gradle :app_pojavlauncher:testDebugUnitTest --tests 'net.kdt.pojavlaunch.lcl.*'
          gradle :app_pojavlauncher:assembleDebug
          apk=app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          test -f "${apk}"
          mkdir -p "${RUNNER_TEMP}/out" && cp "${apk}" "${RUNNER_TEMP}/out/android-runtime-debug.apk"
          {
            echo '### Android game runtime'
            echo "- Upstream commit: \`$(. ../definition/UPSTREAM; echo "${UPSTREAM_COMMIT}")\`"
            echo "- Local patches: $(ls ../definition/patches/*.patch 2>/dev/null | wc -l)"
            echo "- Size: $(stat -c %s "${apk}") bytes"
            echo "- SHA-256: \`$(sha256sum "${apk}" | cut -d' ' -f1)\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          unzip -l "${apk}" | grep -E 'lib/arm64-v8a/' | awk '{print $1, $4}' | sort -k2 | head -60

      - name: Upload runtime debug APK
        if: inputs.upload_apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-runtime-debug-${{ github.run_id }}
          path: ${{ runner.temp }}/out/*.apk
          retention-days: 7
          if-no-files-found: error
