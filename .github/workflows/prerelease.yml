name: Windows and Linux prerelease
run-name: Prerelease ${{ inputs.tag }} (${{ inputs.platform || 'both' }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release, for example v1.0.0-pre.12. Builds the private tag of that name, or the current default branch when no such tag exists'
        required: true
        type: string
      platform:
        description: 'both builds and publishes; a single platform only retains its verified package'
        required: true
        type: choice
        default: both
        options:
          - both
          - windows
          - linux
      source_ref:
        description: 'Reviewed CI-only SHA required for old tags without shard support; production inputs must still match the release tag'
        required: false
        type: string
      source_commit:
        description: 'Test runs only (windows or linux, never published): full private commit SHA to build instead of the tag or default branch'
        required: false
        type: string

env:
  MCL_TELEMETRY_ENDPOINT: ${{ vars.TELEMETRY_ENDPOINT }}

permissions:
  contents: read

concurrency:
  group: launcher-prerelease-${{ inputs.tag }}-${{ inputs.platform || 'both' }}
  # A repeated single-platform test supersedes its older attempt. Keep a
  # two-platform publication running so a test dispatch cannot interrupt it.
  cancel-in-progress: ${{ inputs.platform == 'windows' || inputs.platform == 'linux' }}

jobs:
  # One place decides what every job builds. A tag in the private source is
  # used when it exists; otherwise the default branch head is resolved once and
  # all jobs build that same commit, so a release needs no hand-made tag and
  # cannot mix revisions when the branch moves during the run.
  resolve-source:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Resolve source revision
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Checkout public release preflight
        if: inputs.platform == 'both' || !inputs.platform
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: builder
          persist-credentials: false

      - name: Reject an occupied release version
        if: inputs.platform == 'both' || !inputs.platform
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.tag }}
          RELEASE_PLATFORM: ${{ inputs.platform || 'both' }}
        run: |
          python3 builder/.github/scripts/release_preflight.py --tag "$VERSION_TAG" --platform "$RELEASE_PLATFORM"

      - name: Resolve the private tag or pin the default branch
        id: resolve
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          VERSION_TAG: ${{ inputs.tag }}
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
          PLATFORM: ${{ inputs.platform || 'both' }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_COMMIT" ]]; then
            # A chosen commit is for checking a fix on one platform. A published
            # release always comes from the tag or the default branch.
            if [[ "$PLATFORM" == 'both' || ! "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'source_commit needs a full commit SHA and a single platform; it is never published.'; exit 1
            fi
            echo 'Building the requested commit for a single-platform test run.'
            echo "commit=$REQUESTED_COMMIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(pre|alpha|beta|rc)\.[0-9]+$ ]]; then
            echo 'A prerelease version such as v1.0.0-pre.1 is required.'; exit 1
          fi
          if [[ ! "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ || -z "$SOURCE_READ_TOKEN" ]]; then
            echo 'Configure SOURCE_REPOSITORY and SOURCE_READ_TOKEN in repository Actions secrets.'; exit 1
          fi
          authorization=$(printf 'x-access-token:%s' "$SOURCE_READ_TOKEN" | base64 -w0)
          echo "::add-mask::$authorization"
          if ! refs=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
                ls-remote "https://github.com/$SOURCE_REPOSITORY" HEAD "refs/tags/$VERSION_TAG" 2>/dev/null); then
            echo 'The private source could not be read.'; exit 1
          fi
          if awk -v ref="refs/tags/$VERSION_TAG" '$2 == ref { found = 1 } END { exit !found }' <<<"$refs"; then
            echo 'The private source has a tag with this version; every job builds that tag.'
            echo 'commit=' >> "$GITHUB_OUTPUT"
          else
            commit=$(awk '$2 == "HEAD" { print $1 }' <<<"$refs")
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'The default branch of the private source could not be resolved.'; exit 1
            fi
            echo 'No private tag with this version; every job builds the same pinned default-branch commit.'
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
          fi

  # Main and companion runners compile independently from the same immutable
  # inputs. Only a verified complete union may upload a runtime package; no
  # private source, build tree or executable is transferred between runners.
  build-windows:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.platform == 'both' || inputs.platform == 'windows' || !inputs.platform)
    needs: resolve-source
    name: Build windows-x64
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout public packaging tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: builder
          persist-credentials: false

      - name: Validate Windows packaging inventory rules
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -NonInteractive -File builder/.github/scripts/test_windows_runtime_inventory.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime inventory assertions failed.' }
          pwsh -NoLogo -NoProfile -NonInteractive -File builder/.github/scripts/test_windows_bundle_smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows independent bundle smoke assertions failed.' }
          python -m unittest discover -s builder/.github/scripts -p test_release_support_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'Versioned bundle release directions failed.' }

      - name: Prepare private source and verify release inputs
        uses: ./builder/.github/actions/prepare-source
        with:
          source_repository: ${{ secrets.SOURCE_REPOSITORY }}
          source_read_token: ${{ secrets.SOURCE_READ_TOKEN }}
          tag: ${{ inputs.tag }}
          source_ref: ${{ inputs.source_ref }}
          source_commit: ${{ needs.resolve-source.outputs.commit }}

      - name: Require reviewed shard-capable source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = Join-Path $env:GITHUB_WORKSPACE 'source/qt-native'
          $plan = Join-Path $native 'tests/ci/ui-shard-plan.json'
          $driver = Join-Path $native 'scripts/ci-build-test.ps1'
          $tokens = $null; $parseErrors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile($driver, [ref]$tokens, [ref]$parseErrors)
          $parameters = @($ast.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath })
          if ($parseErrors.Count -or -not (Test-Path -LiteralPath $plan -PathType Leaf) -or $parameters -cnotcontains 'TestShard') {
            throw 'This tag needs a reviewed CI-only source_ref containing shard support. Production inputs must still match the tag.'
          }
          & python builder/.github/scripts/ci_test_proof.py validate-plan --plan $plan
          if ($LASTEXITCODE -ne 0) { throw 'The source shard plan is invalid or unsupported.' }
          Write-Output 'Reviewed test shard support is available.'

      - name: Cache verified public Windows toolchain archives
        id: windows-archives
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mcl-ci-archives
          key: windows-2022-native-archives-${{ hashFiles('source/qt-native/ci/toolchain-lock.json') }}

      - name: Restore the four pinned public Qt source archives
        id: qt-source-archives
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            source/qt-native/.tools/downloads/qtbase-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtdeclarative-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtsvg-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtimageformats-everywhere-src-6.8.3.zip
          # Locked archive identities are stable across checkout line endings.
          key: qt-6.8.3-public-source-archives-a32f9f88e9c283c326cb94a3c1006ebdaf817d20a471da555995ae051a17fa44
          restore-keys: qt-6.8.3-public-source-archives-
          enableCrossOsArchive: true

      - name: Build, test and package Windows privately
        id: windows-package
        shell: pwsh
        env:
          VERSION_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-build-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          $workflowSha = $env:GITHUB_SHA
          try {
            $env:GITHUB_SHA = (& git -C source rev-parse HEAD)
            & pwsh -NoLogo -NoProfile -NonInteractive -File builder/.github/scripts/package-windows.ps1 `
              -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'source') `
              -OutputDirectory (Join-Path $env:RUNNER_TEMP 'release-assets') `
              -VersionTag $env:VERSION_TAG -TestShard primary *> (Join-Path $logs 'windows-build.log')
            if ($LASTEXITCODE -ne 0) { throw 'Private build failed.' }
            $env:GITHUB_SHA = $workflowSha
            & python builder/.github/scripts/ci_test_proof.py create `
              --source-root (Join-Path $env:GITHUB_WORKSPACE 'source') `
              --build-dir (Join-Path $env:GITHUB_WORKSPACE 'source/qt-native/build-ci') `
              --sdk-root (Join-Path $env:GITHUB_WORKSPACE 'source/qt-native/.tools/Qt/6.8.3/mingw_64') `
              --driver-result (Join-Path $env:RUNNER_TEMP 'mcl-ci-evidence-dynamic/result.json') `
              --junit (Join-Path $env:RUNNER_TEMP 'mcl-ci-evidence-dynamic/ctest.xml') `
              --platform windows-x64 --shard primary `
              --output (Join-Path $logs 'windows-primary-proof.json') *> (Join-Path $logs 'windows-proof.log')
            if ($LASTEXITCODE -ne 0) { throw 'Primary test proof failed.' }
            Write-Output 'Windows primary tests and extracted-package startup check passed; companion validation follows.'
          } catch {
            Write-Error -ErrorAction Continue 'Windows packaging failed. Raw diagnostics are not public; encrypted diagnostics are retained.'
            exit 1
          } finally {
            $env:GITHUB_SHA = $workflowSha
            $evidence = Join-Path $env:RUNNER_TEMP 'mcl-ci-evidence-dynamic'
            if (Test-Path $evidence) { Copy-Item $evidence (Join-Path $logs 'ctest') -Recurse }
          }

      - name: Save verified public Windows archives even if later tests fail
        if: always() && steps.windows-archives.outputs.cache-hit != 'true' && steps.windows-package.outputs.toolchain_verified == 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mcl-ci-archives
          key: windows-2022-native-archives-${{ hashFiles('source/qt-native/ci/toolchain-lock.json') }}

      - name: Save only the four verified public Qt source archives
        if: always() && steps.qt-source-archives.outputs.cache-hit != 'true' && steps.windows-package.outputs.legal_archives_verified == 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            source/qt-native/.tools/downloads/qtbase-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtdeclarative-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtsvg-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtimageformats-everywhere-src-6.8.3.zip
          # Locked archive identities are stable across checkout line endings.
          key: qt-6.8.3-public-source-archives-a32f9f88e9c283c326cb94a3c1006ebdaf817d20a471da555995ae051a17fa44

          enableCrossOsArchive: true

      - name: Verify complete Windows test coverage across both runners
        id: windows-verification
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-build-logs'
          & python builder/.github/scripts/ci_test_proof.py verify `
            --local-proof (Join-Path $logs 'windows-primary-proof.json') `
            --output (Join-Path $logs 'windows-combined-proof.json') `
            --timeout-seconds 1800 --poll-seconds 20 *> (Join-Path $logs 'windows-verification.log')
          if ($LASTEXITCODE -ne 0) {
            Write-Error -ErrorAction Continue 'Complete Windows verification failed. A matching successful companion from this run attempt is required; rerun all jobs when repeating an attempt.'
            exit 1
          }
          Write-Output 'Both Windows runners passed the complete current test inventory.'

      - name: Record verified Windows release provenance
        id: windows-provenance
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' && steps.windows-verification.outcome == 'success' }}
        shell: pwsh
        env:
          VERSION_TAG: ${{ inputs.tag }}
          RELEASE_PURPOSE: ${{ inputs.source_commit && 'test' || 'release' }}
        run: |
          $ErrorActionPreference = 'Stop'
          & python builder/.github/scripts/release_provenance.py create `
            --proof (Join-Path $env:RUNNER_TEMP 'private-build-logs/windows-combined-proof.json') `
            --build-dir (Join-Path $env:GITHUB_WORKSPACE 'source/qt-native/build-ci') `
            --runtime (Join-Path $env:RUNNER_TEMP ('release-assets/LittleCraftLauncher-' + $env:VERSION_TAG + '-windows-x64.zip')) `
            --platform windows-x64 --tag $env:VERSION_TAG --purpose $env:RELEASE_PURPOSE `
            --output (Join-Path $env:RUNNER_TEMP 'release-provenance/windows.json')
          if ($LASTEXITCODE -ne 0) { throw 'Release provenance could not be established.' }

      - name: Retain Windows release provenance
        id: windows-provenance-upload
        if: ${{ !cancelled() && steps.windows-provenance.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provenance-windows-x64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-provenance/windows.json
          if-no-files-found: error
          retention-days: 3

      - name: Write safe CI summary (windows-x64)
        id: safe-diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          SAFE_JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          & python builder/.github/scripts/ci_safe_diagnostics.py create `
            --source-root (Join-Path $env:GITHUB_WORKSPACE 'source') `
            --logs-dir (Join-Path $env:RUNNER_TEMP 'private-build-logs') `
            --platform windows-x64 --status $env:SAFE_JOB_STATUS `
            --output (Join-Path $env:RUNNER_TEMP 'safe-diagnostics/windows-x64/summary.json')
          if ($LASTEXITCODE -ne 0) { throw 'Safe diagnostic summary could not be generated. Raw logs remain private.' }

      - name: Retain safe CI summary (windows-x64)
        if: ${{ always() && steps.safe-diagnostics.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safe-diagnostics-windows-x64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safe-diagnostics/windows-x64/summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Encrypt private diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          PLATFORM_NAME: windows-x64
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-build-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          $out = Join-Path $env:RUNNER_TEMP ('diagnostics-' + $env:PLATFORM_NAME + '.p7m')
          if (Test-Path builder/.github/scripts/encrypt-diagnostics.py) {
            python builder/.github/scripts/encrypt-diagnostics.py --certificate builder/.github/scripts/diagnostics-certificate.pem --logs-dir $logs --output $out --exclude-screenshots
            if ($LASTEXITCODE -ne 0) { throw 'Diagnostics encryption failed; raw files will not be uploaded.' }
          }

      - name: Retain encrypted diagnostics only
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-diagnostics-windows-x64
          path: ${{ runner.temp }}/diagnostics-windows-x64.p7m
          if-no-files-found: ignore
          retention-days: 3

      - name: Retain final runtime package only
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' && steps.windows-verification.outcome == 'success' && steps.windows-provenance-upload.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-x64
          path: ${{ runner.temp }}/release-assets/LittleCraftLauncher-${{ inputs.tag }}-windows-x64.*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Retain matching public Qt dependency sources
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' && steps.windows-verification.outcome == 'success' && steps.windows-provenance-upload.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-qt-dependency-sources
          path: source/qt-native/.tools/downloads/*-everywhere-src-6.8.3.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  build-linux:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.platform == 'both' || inputs.platform == 'linux' || !inputs.platform)
    needs: resolve-source
    name: Build linux-x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout public packaging tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: builder
          persist-credentials: false

      - name: Prepare private source and verify release inputs
        uses: ./builder/.github/actions/prepare-source
        with:
          source_repository: ${{ secrets.SOURCE_REPOSITORY }}
          source_read_token: ${{ secrets.SOURCE_READ_TOKEN }}
          tag: ${{ inputs.tag }}
          source_ref: ${{ inputs.source_ref }}
          source_commit: ${{ needs.resolve-source.outputs.commit }}

      - name: Require reviewed shard-capable source
        run: |
          python builder/.github/scripts/ci_test_proof.py validate-plan \
            --plan "$GITHUB_WORKSPACE/source/qt-native/tests/ci/ui-shard-plan.json"

      - name: Restore the five pinned public Qt source archives
        id: qt-source-archives
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            source/qt-native/.tools/downloads/qtbase-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtdeclarative-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtsvg-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtimageformats-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtwayland-everywhere-src-6.8.3.zip
          key: qt-6.8.3-linux-source-archives-wayland-4c2773404c4a
          restore-keys: qt-6.8.3-public-source-archives-
          enableCrossOsArchive: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build patchelf squashfs-tools weston x11-utils dbus-x11 libwayland-client0 libwayland-cursor0 libwayland-egl1 libgl1-mesa-dev libegl1 libopengl0 libfontconfig1 libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-randr0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xkb1 libxrender1 libdbus-1-3 libssl3 fonts-noto-cjk xvfb xauth

      - name: Pin Linux Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'

      - name: Cache public Linux Qt SDK only
        id: linux-qt
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/qt-linux
          key: linux-x86_64-qt-6.8.3-gcc64-runtime-modules-v3-wayland

      - name: Install Linux Qt 6.8.3
        if: steps.linux-qt.outputs.cache-hit != 'true'
        run: |
          # No restore-prefix fallback is used. Retain an unexpected partial
          # SDK instead of silently mixing it with a fresh installation.
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sdk = Path(os.environ['RUNNER_TEMP']) / 'qt-linux'
          if sdk.exists() and (not sdk.is_dir() or any(sdk.iterdir())):
              sys.exit('Unexpected partial public SDK retained; installation stopped.')
          PY
          python -m pip install 'aqtinstall==3.3.0'
          # QtSvg is part of the base Qt 6.8.3 archive set, not an addon module.
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtimageformats --archives qtbase qtdeclarative qtsvg icu qtwayland -O "$RUNNER_TEMP/qt-linux"

      - name: Verify public Linux SDK version and required modules
        run: |
          python builder/.github/scripts/verify-cache-inputs.py --kind linux-qt-sdk --qt-root "$RUNNER_TEMP/qt-linux/6.8.3/gcc_64"

      - name: Save the public Linux SDK before building private code
        if: steps.linux-qt.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/qt-linux
          key: linux-x86_64-qt-6.8.3-gcc64-runtime-modules-v3-wayland

      - name: Restore pinned public Linux deployment tools
        id: linux-tools
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/linuxdeploy-tools
          key: linuxdeploy-x86_64-${{ hashFiles('builder/.github/scripts/linux_toolchain.py') }}

      - name: Verify pinned Linux deployment tools
        run: python3 builder/.github/scripts/fetch-linux-tools.py --tool-dir "$RUNNER_TEMP/linuxdeploy-tools"

      - name: Save verified public Linux deployment tools
        if: steps.linux-tools.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/linuxdeploy-tools
          key: linuxdeploy-x86_64-${{ hashFiles('builder/.github/scripts/linux_toolchain.py') }}

      - name: Build, test and package Linux privately
        id: linux-package
        env:
          VERSION_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/private-build-logs"
          if ! bash -euo pipefail > "$RUNNER_TEMP/private-build-logs/linux-build.log" 2>&1 <<'BUILD'
            build_jobs="$(getconf _NPROCESSORS_ONLN)"
            if test "$build_jobs" -gt 4; then build_jobs=4; fi
            qt_root="$RUNNER_TEMP/qt-linux/6.8.3/gcc_64"
            test "$("$qt_root/bin/qmake" -query QT_VERSION)" = '6.8.3'
            export LD_LIBRARY_PATH="$qt_root/lib"
            export QT_PLUGIN_PATH="$qt_root/plugins"
            export QML_IMPORT_PATH="$qt_root/qml"
            export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QML_DISABLE_DISK_CACHE=1
            # Keep public dependency acquisition separate from private app inputs.
            python builder/.github/scripts/fetch-linux-tools.py --tool-dir "$RUNNER_TEMP/linuxdeploy-tools" --source-root "$GITHUB_WORKSPACE/source"
            python builder/.github/scripts/verify-cache-inputs.py --kind qt-source-archives --source-root "$GITHUB_WORKSPACE/source" --include-wayland
            echo 'legal_archives_verified=true' >> "$GITHUB_OUTPUT"
            cmake -S source/qt-native -B "$RUNNER_TEMP/build-linux" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DMCL_STATIC_RELEASE=OFF -DMCL_SERIALIZE_SOFTWARE_UI=ON \
              -DMCL_DISTRIBUTION_BUILD=OFF -DCMAKE_PREFIX_PATH="$qt_root"
            cmake --build "$RUNNER_TEMP/build-linux" --target mclauncher-qt --parallel "$build_jobs"
            python builder/.github/scripts/package-linux.py --source-root "$GITHUB_WORKSPACE/source" \
              --build-dir "$RUNNER_TEMP/build-linux" --qt-root "$qt_root" \
              --output-dir "$RUNNER_TEMP/release-assets" --tag "$VERSION_TAG" --tool-dir "$RUNNER_TEMP/linuxdeploy-tools"
            if ! python builder/.github/scripts/smoke-linux.py \
              --archive "$RUNNER_TEMP/release-assets/LittleCraftLauncher-$VERSION_TAG-linux-x86_64.AppImage" --tag "$VERSION_TAG" --backend both; then
              runtime_archive="$RUNNER_TEMP/release-assets/LittleCraftLauncher-$VERSION_TAG-linux-x86_64.AppImage"
              if test "$(stat -c %s "$runtime_archive")" -le 104857600; then
                cp "$runtime_archive" "$RUNNER_TEMP/private-build-logs/runtime-package.AppImage"
              fi
              exit 1
            fi
            # The already-packaged application stays in the same build tree.
            # Upload remains gated on every local test passing afterwards.
            cmake --build "$RUNNER_TEMP/build-linux" --parallel "$build_jobs"
            python builder/.github/scripts/run-linux-test-shard.py \
              --source-root "$GITHUB_WORKSPACE/source" --build-dir "$RUNNER_TEMP/build-linux" --shard primary \
              --junit "$RUNNER_TEMP/private-build-logs/ctest.xml" \
              --result-json "$RUNNER_TEMP/private-build-logs/test-result.json"
            python builder/.github/scripts/ci_test_proof.py create \
              --source-root "$GITHUB_WORKSPACE/source" --build-dir "$RUNNER_TEMP/build-linux" --sdk-root "$qt_root" \
              --driver-result "$RUNNER_TEMP/private-build-logs/test-result.json" \
              --junit "$RUNNER_TEMP/private-build-logs/ctest.xml" --platform linux-x86_64 --shard primary \
              --output "$RUNNER_TEMP/private-build-logs/linux-primary-proof.json"
          BUILD
          then
            echo '::error::Linux packaging failed. Raw diagnostics are not public; encrypted diagnostics are retained.'
            exit 1
          fi
          echo 'Linux primary tests and extracted-package startup check passed; companion validation follows.'

      - name: Save only the five verified public Qt source archives
        if: always() && steps.qt-source-archives.outputs.cache-hit != 'true' && steps.linux-package.outputs.legal_archives_verified == 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            source/qt-native/.tools/downloads/qtbase-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtdeclarative-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtsvg-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtimageformats-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtwayland-everywhere-src-6.8.3.zip
          key: qt-6.8.3-linux-source-archives-wayland-4c2773404c4a
          enableCrossOsArchive: true

      - name: Verify complete Linux test coverage across both runners
        id: linux-verification
        if: ${{ !cancelled() && steps.linux-package.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python builder/.github/scripts/ci_test_proof.py verify \
            --local-proof "$RUNNER_TEMP/private-build-logs/linux-primary-proof.json" \
            --output "$RUNNER_TEMP/private-build-logs/linux-combined-proof.json" \
            --timeout-seconds 1800 --poll-seconds 20 > "$RUNNER_TEMP/private-build-logs/linux-verification.log" 2>&1; then
            echo '::error::Complete Linux verification failed. A matching successful companion from this run attempt is required; rerun all jobs when repeating an attempt.'
            exit 1
          fi
          echo 'Both Linux runners passed the complete current test inventory.'

      - name: Record verified Linux release provenance
        id: linux-provenance
        if: ${{ !cancelled() && steps.linux-package.outcome == 'success' && steps.linux-verification.outcome == 'success' }}
        env:
          VERSION_TAG: ${{ inputs.tag }}
          RELEASE_PURPOSE: ${{ inputs.source_commit && 'test' || 'release' }}
        run: |
          python3 builder/.github/scripts/release_provenance.py create \
            --proof "$RUNNER_TEMP/private-build-logs/linux-combined-proof.json" \
            --build-dir "$RUNNER_TEMP/build-linux" \
            --runtime "$RUNNER_TEMP/release-assets/LittleCraftLauncher-$VERSION_TAG-linux-x86_64.AppImage" \
            --platform linux-x86_64 --tag "$VERSION_TAG" --purpose "$RELEASE_PURPOSE" \
            --output "$RUNNER_TEMP/release-provenance/linux.json"

      - name: Retain Linux release provenance
        id: linux-provenance-upload
        if: ${{ !cancelled() && steps.linux-provenance.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provenance-linux-x86_64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-provenance/linux.json
          if-no-files-found: error
          retention-days: 3

      - name: Write safe CI summary (linux-x86_64)
        id: safe-diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SAFE_JOB_STATUS: ${{ job.status }}
        run: |
          python3 builder/.github/scripts/ci_safe_diagnostics.py create \
            --source-root "$GITHUB_WORKSPACE/source" \
            --logs-dir "$RUNNER_TEMP/private-build-logs" \
            --platform linux-x86_64 --status "$SAFE_JOB_STATUS" \
            --output "$RUNNER_TEMP/safe-diagnostics/linux-x86_64/summary.json"

      - name: Retain safe CI summary (linux-x86_64)
        if: ${{ always() && steps.safe-diagnostics.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safe-diagnostics-linux-x86_64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safe-diagnostics/linux-x86_64/summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Encrypt private diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          PLATFORM_NAME: linux-x86_64
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-build-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          $out = Join-Path $env:RUNNER_TEMP ('diagnostics-' + $env:PLATFORM_NAME + '.p7m')
          if (Test-Path builder/.github/scripts/encrypt-diagnostics.py) {
            python builder/.github/scripts/encrypt-diagnostics.py --certificate builder/.github/scripts/diagnostics-certificate.pem --logs-dir $logs --output $out --exclude-screenshots
            if ($LASTEXITCODE -ne 0) { throw 'Diagnostics encryption failed; raw files will not be uploaded.' }
          }

      - name: Retain encrypted diagnostics only
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-diagnostics-linux-x86_64
          path: ${{ runner.temp }}/diagnostics-linux-x86_64.p7m
          if-no-files-found: ignore
          retention-days: 3

      - name: Retain final runtime package only
        if: ${{ !cancelled() && steps.linux-package.outcome == 'success' && steps.linux-verification.outcome == 'success' && steps.linux-provenance-upload.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-x86_64
          path: ${{ runner.temp }}/release-assets/LittleCraftLauncher-${{ inputs.tag }}-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Retain verified Qt Wayland source input
        if: ${{ !cancelled() && steps.linux-package.outcome == 'success' && steps.linux-verification.outcome == 'success' && steps.linux-provenance-upload.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-qt-wayland-source
          path: source/qt-native/.tools/downloads/qtwayland-everywhere-src-6.8.3.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  test-windows-companion:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.platform == 'both' || inputs.platform == 'windows' || !inputs.platform)
    needs: resolve-source
    name: Test windows-x64 companion UI
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout public packaging tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: builder
          persist-credentials: false

      - name: Prepare private source and verify release inputs
        uses: ./builder/.github/actions/prepare-source
        with:
          source_repository: ${{ secrets.SOURCE_REPOSITORY }}
          source_read_token: ${{ secrets.SOURCE_READ_TOKEN }}
          tag: ${{ inputs.tag }}
          source_ref: ${{ inputs.source_ref }}
          source_commit: ${{ needs.resolve-source.outputs.commit }}

      - name: Require reviewed shard-capable source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = Join-Path $env:GITHUB_WORKSPACE 'source/qt-native'
          $plan = Join-Path $native 'tests/ci/ui-shard-plan.json'
          $driver = Join-Path $native 'scripts/ci-build-test.ps1'
          $tokens = $null; $parseErrors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile($driver, [ref]$tokens, [ref]$parseErrors)
          $parameters = @($ast.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath })
          if ($parseErrors.Count -or -not (Test-Path -LiteralPath $plan -PathType Leaf) -or $parameters -cnotcontains 'TestShard') {
            throw 'This tag needs a reviewed CI-only source_ref containing shard support. Production inputs must still match the tag.'
          }
          & python builder/.github/scripts/ci_test_proof.py validate-plan --plan $plan
          if ($LASTEXITCODE -ne 0) { throw 'The source shard plan is invalid or unsupported.' }
          Write-Output 'Reviewed test shard support is available.'

      - name: Restore verified public Windows toolchain archives
        id: windows-archives
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mcl-ci-archives
          key: windows-2022-native-archives-${{ hashFiles('source/qt-native/ci/toolchain-lock.json') }}

      - name: Build and test Windows companion privately
        id: windows-companion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-build-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          $scripts = Join-Path $env:GITHUB_WORKSPACE 'source/qt-native/scripts'
          $sourceCommit = (& git -C source rev-parse --verify HEAD 2>$null)
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Private source identity could not be verified.' }
          $workflowSha = $env:GITHUB_SHA
          try {
            $env:GITHUB_SHA = $sourceCommit
            & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $scripts 'ci-bootstrap.ps1') -Run *> (Join-Path $logs 'bootstrap.log')
            if ($LASTEXITCODE -ne 0) { throw 'Private toolchain bootstrap failed.' }
            & python builder/.github/scripts/verify-cache-inputs.py --kind windows-archives `
              --source-root (Join-Path $env:GITHUB_WORKSPACE 'source') `
              --cache-root (Join-Path $env:RUNNER_TEMP 'mcl-ci-archives') *> (Join-Path $logs 'verify-archives.log')
            if ($LASTEXITCODE -ne 0) { throw 'Public toolchain verification failed.' }
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "toolchain_verified=true`n", [Text.UTF8Encoding]::new($false))
            & pwsh -NoLogo -NoProfile -NonInteractive -File (Join-Path $scripts 'ci-build-test.ps1') `
              -Run -Mode dynamic -TestShard companion *> (Join-Path $logs 'windows-companion.log')
            if ($LASTEXITCODE -ne 0) { throw 'Companion tests failed.' }
            $env:GITHUB_SHA = $workflowSha
            & python builder/.github/scripts/ci_test_proof.py create `
              --source-root (Join-Path $env:GITHUB_WORKSPACE 'source') `
              --build-dir (Join-Path $env:GITHUB_WORKSPACE 'source/qt-native/build-ci') `
              --sdk-root (Join-Path $env:GITHUB_WORKSPACE 'source/qt-native/.tools/Qt/6.8.3/mingw_64') `
              --driver-result (Join-Path $env:RUNNER_TEMP 'mcl-ci-evidence-dynamic/result.json') `
              --junit (Join-Path $env:RUNNER_TEMP 'mcl-ci-evidence-dynamic/ctest.xml') `
              --platform windows-x64 --shard companion `
              --output (Join-Path $env:RUNNER_TEMP 'ci-proof-windows-companion/proof.json') *> (Join-Path $logs 'windows-proof.log')
            if ($LASTEXITCODE -ne 0) { throw 'Companion test proof failed.' }
            Write-Output 'Windows companion tests passed and their sanitized proof is ready.'
          } catch {
            Write-Error -ErrorAction Continue 'Windows companion failed. Raw source diagnostics remain private and are retained encrypted.'
            exit 1
          } finally {
            $env:GITHUB_SHA = $workflowSha
            $evidence = Join-Path $env:RUNNER_TEMP 'mcl-ci-evidence-dynamic'
            if (Test-Path $evidence) { Copy-Item $evidence (Join-Path $logs 'ctest') -Recurse }
          }

      - name: Save only verified public Windows toolchain archives
        if: always() && steps.windows-archives.outputs.cache-hit != 'true' && steps.windows-companion.outputs.toolchain_verified == 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mcl-ci-archives
          key: windows-2022-native-archives-${{ hashFiles('source/qt-native/ci/toolchain-lock.json') }}

      - name: Write safe CI summary (windows-ui-companion)
        id: safe-diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          SAFE_JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          & python builder/.github/scripts/ci_safe_diagnostics.py create `
            --source-root (Join-Path $env:GITHUB_WORKSPACE 'source') `
            --logs-dir (Join-Path $env:RUNNER_TEMP 'private-build-logs') `
            --platform windows-ui-companion --status $env:SAFE_JOB_STATUS `
            --output (Join-Path $env:RUNNER_TEMP 'safe-diagnostics/windows-ui-companion/summary.json')
          if ($LASTEXITCODE -ne 0) { throw 'Safe diagnostic summary could not be generated. Raw logs remain private.' }

      - name: Retain safe CI summary (windows-ui-companion)
        if: ${{ always() && steps.safe-diagnostics.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safe-diagnostics-windows-ui-companion-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safe-diagnostics/windows-ui-companion/summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Encrypt private Windows companion diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-build-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          python builder/.github/scripts/encrypt-diagnostics.py --certificate builder/.github/scripts/diagnostics-certificate.pem `
            --logs-dir $logs --output (Join-Path $env:RUNNER_TEMP 'diagnostics-windows-ui-companion.p7m') --exclude-screenshots
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostics encryption failed; raw files will not be uploaded.' }

      - name: Retain encrypted Windows companion diagnostics only
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-diagnostics-windows-ui-companion
          path: ${{ runner.temp }}/diagnostics-windows-ui-companion.p7m
          if-no-files-found: ignore
          retention-days: 3

      - name: Retain sanitized Windows companion proof
        if: ${{ !cancelled() && steps.windows-companion.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-proof-windows-companion-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-proof-windows-companion/proof.json
          if-no-files-found: error
          retention-days: 3

  test-linux-companion:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.platform == 'both' || inputs.platform == 'linux' || !inputs.platform)
    needs: resolve-source
    name: Test linux-x86_64 companion UI
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout public packaging tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: builder
          persist-credentials: false

      - name: Prepare private source and verify release inputs
        uses: ./builder/.github/actions/prepare-source
        with:
          source_repository: ${{ secrets.SOURCE_REPOSITORY }}
          source_read_token: ${{ secrets.SOURCE_READ_TOKEN }}
          tag: ${{ inputs.tag }}
          source_ref: ${{ inputs.source_ref }}
          source_commit: ${{ needs.resolve-source.outputs.commit }}

      - name: Require reviewed shard-capable source
        run: |
          python builder/.github/scripts/ci_test_proof.py validate-plan \
            --plan "$GITHUB_WORKSPACE/source/qt-native/tests/ci/ui-shard-plan.json"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build patchelf squashfs-tools weston x11-utils dbus-x11 libwayland-client0 libwayland-cursor0 libwayland-egl1 libgl1-mesa-dev libegl1 libopengl0 libfontconfig1 libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-randr0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xkb1 libxrender1 libdbus-1-3 libssl3 fonts-noto-cjk xvfb xauth

      - name: Pin Linux Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'

      - name: Cache public Linux Qt SDK only
        id: linux-qt
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/qt-linux
          key: linux-x86_64-qt-6.8.3-gcc64-runtime-modules-v3-wayland

      - name: Install Linux Qt 6.8.3
        if: steps.linux-qt.outputs.cache-hit != 'true'
        run: |
          # No restore-prefix fallback is used. Retain an unexpected partial
          # SDK instead of silently mixing it with a fresh installation.
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sdk = Path(os.environ['RUNNER_TEMP']) / 'qt-linux'
          if sdk.exists() and (not sdk.is_dir() or any(sdk.iterdir())):
              sys.exit('Unexpected partial public SDK retained; installation stopped.')
          PY
          python -m pip install 'aqtinstall==3.3.0'
          # QtSvg is part of the base Qt 6.8.3 archive set, not an addon module.
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtimageformats --archives qtbase qtdeclarative qtsvg icu qtwayland -O "$RUNNER_TEMP/qt-linux"

      - name: Verify public Linux SDK version and required modules
        run: |
          python builder/.github/scripts/verify-cache-inputs.py --kind linux-qt-sdk --qt-root "$RUNNER_TEMP/qt-linux/6.8.3/gcc_64"

      - name: Save the public Linux SDK before building private code
        if: steps.linux-qt.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/qt-linux
          key: linux-x86_64-qt-6.8.3-gcc64-runtime-modules-v3-wayland

      - name: Build and test Linux companion privately
        id: linux-companion
        run: |
          mkdir -p "$RUNNER_TEMP/private-build-logs"
          if ! bash -euo pipefail > "$RUNNER_TEMP/private-build-logs/linux-companion.log" 2>&1 <<'BUILD'
            build_jobs="$(getconf _NPROCESSORS_ONLN)"
            if test "$build_jobs" -gt 4; then build_jobs=4; fi
            qt_root="$RUNNER_TEMP/qt-linux/6.8.3/gcc_64"
            test "$("$qt_root/bin/qmake" -query QT_VERSION)" = '6.8.3'
            export LD_LIBRARY_PATH="$qt_root/lib"
            export QT_PLUGIN_PATH="$qt_root/plugins"
            export QML_IMPORT_PATH="$qt_root/qml"
            export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QML_DISABLE_DISK_CACHE=1
            cmake -S source/qt-native -B "$RUNNER_TEMP/build-linux" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DMCL_STATIC_RELEASE=OFF -DMCL_SERIALIZE_SOFTWARE_UI=ON \
              -DMCL_DISTRIBUTION_BUILD=OFF -DCMAKE_PREFIX_PATH="$qt_root"
            cmake --build "$RUNNER_TEMP/build-linux" --parallel "$build_jobs"
            python builder/.github/scripts/run-linux-test-shard.py \
              --source-root "$GITHUB_WORKSPACE/source" --build-dir "$RUNNER_TEMP/build-linux" --shard companion \
              --junit "$RUNNER_TEMP/private-build-logs/ctest.xml" \
              --result-json "$RUNNER_TEMP/private-build-logs/test-result.json"
            python builder/.github/scripts/ci_test_proof.py create \
              --source-root "$GITHUB_WORKSPACE/source" --build-dir "$RUNNER_TEMP/build-linux" --sdk-root "$qt_root" \
              --driver-result "$RUNNER_TEMP/private-build-logs/test-result.json" \
              --junit "$RUNNER_TEMP/private-build-logs/ctest.xml" --platform linux-x86_64 --shard companion \
              --output "$RUNNER_TEMP/ci-proof-linux-companion/proof.json"
          BUILD
          then
            echo '::error::Linux companion failed. Raw source diagnostics remain private and are retained encrypted.'
            exit 1
          fi
          echo 'Linux companion tests passed and their sanitized proof is ready.'

      - name: Write safe CI summary (linux-ui-companion)
        id: safe-diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SAFE_JOB_STATUS: ${{ job.status }}
        run: |
          python3 builder/.github/scripts/ci_safe_diagnostics.py create \
            --source-root "$GITHUB_WORKSPACE/source" \
            --logs-dir "$RUNNER_TEMP/private-build-logs" \
            --platform linux-ui-companion --status "$SAFE_JOB_STATUS" \
            --output "$RUNNER_TEMP/safe-diagnostics/linux-ui-companion/summary.json"

      - name: Retain safe CI summary (linux-ui-companion)
        if: ${{ always() && steps.safe-diagnostics.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safe-diagnostics-linux-ui-companion-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safe-diagnostics/linux-ui-companion/summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Encrypt private Linux companion diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-build-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          python builder/.github/scripts/encrypt-diagnostics.py --certificate builder/.github/scripts/diagnostics-certificate.pem `
            --logs-dir $logs --output (Join-Path $env:RUNNER_TEMP 'diagnostics-linux-ui-companion.p7m') --exclude-screenshots
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostics encryption failed; raw files will not be uploaded.' }

      - name: Retain encrypted Linux companion diagnostics only
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-diagnostics-linux-ui-companion
          path: ${{ runner.temp }}/diagnostics-linux-ui-companion.p7m
          if-no-files-found: ignore
          retention-days: 3

      - name: Retain sanitized Linux companion proof
        if: ${{ !cancelled() && steps.linux-companion.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-proof-linux-companion-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-proof-linux-companion/proof.json
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish both platforms as a prerelease
    needs: [build-windows, build-linux]
    if: always() && (inputs.platform == 'both' || !inputs.platform) && needs.build-windows.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download runtime packages and verified dependency inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Checkout public release tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: release-tools
          persist-credentials: false

      - name: Prepare static AppImage inspection
        run: |
          if ! command -v unsquashfs >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends squashfs-tools
          fi

      - name: Verify packages and publish two downloads
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.tag }}
        run: |
          python3 release-tools/.github/scripts/release_provenance.py verify-runs \
            --repository "$GITHUB_REPOSITORY" --tag "$VERSION_TAG" \
            --windows-run-id "$GITHUB_RUN_ID" --linux-run-id "$GITHUB_RUN_ID" --assets release-assets
          python3 release-tools/.github/scripts/publish-prerelease.py \
            --repository "$GITHUB_REPOSITORY" --tag "$VERSION_TAG" \
            --target "$GITHUB_SHA" --assets release-assets

      - name: Remove temporary packages after verifying the published prerelease
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.tag }}
        run: |
          python3 release-tools/.github/scripts/prune-published-artifacts.py \
            --repository "$GITHUB_REPOSITORY" --tag "$VERSION_TAG" --run-id "$GITHUB_RUN_ID"
