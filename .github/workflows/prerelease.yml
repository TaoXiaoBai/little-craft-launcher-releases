name: Windows and Linux prerelease
run-name: Prerelease ${{ inputs.tag }} (${{ inputs.platform || 'both' }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing private source tag, for example v1.0.0-pre.1'
        required: true
        type: string
      platform:
        description: 'both builds and publishes; a single platform only retains its verified package'
        required: true
        type: choice
        default: both
        options:
          - both
          - windows
          - linux
      source_ref:
        description: 'Optional full commit SHA for test/CI-only fixes; production inputs must match the release tag'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: launcher-prerelease-${{ inputs.tag }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.platform == 'both' || inputs.platform == 'windows' || !inputs.platform)
    name: Build windows-x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout public packaging tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: builder
          persist-credentials: false

      - name: Prepare private source and verify release inputs
        uses: ./builder/.github/actions/prepare-source
        with:
          source_repository: ${{ secrets.SOURCE_REPOSITORY }}
          source_read_token: ${{ secrets.SOURCE_READ_TOKEN }}
          tag: ${{ inputs.tag }}
          source_ref: ${{ inputs.source_ref }}

      - name: Cache verified public Windows toolchain archives
        id: windows-archives
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mcl-ci-archives
          key: windows-2022-native-archives-${{ hashFiles('source/qt-native/ci/toolchain-lock.json') }}

      - name: Restore the four pinned public Qt source archives
        id: qt-source-archives
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            source/qt-native/.tools/downloads/qtbase-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtdeclarative-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtsvg-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtimageformats-everywhere-src-6.8.3.zip
          # Locked archive identities are stable across checkout line endings.
          key: qt-6.8.3-public-source-archives-a32f9f88e9c283c326cb94a3c1006ebdaf817d20a471da555995ae051a17fa44
          restore-keys: qt-6.8.3-public-source-archives-
          enableCrossOsArchive: true

      - name: Build, test and package Windows privately
        id: windows-package
        shell: pwsh
        env:
          VERSION_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-build-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          $workflowSha = $env:GITHUB_SHA
          try {
            $env:GITHUB_SHA = (& git -C source rev-parse HEAD)
            & pwsh -NoLogo -NoProfile -NonInteractive -File builder/.github/scripts/package-windows.ps1 `
              -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'source') `
              -OutputDirectory (Join-Path $env:RUNNER_TEMP 'release-assets') `
              -VersionTag $env:VERSION_TAG *> (Join-Path $logs 'windows-build.log')
            if ($LASTEXITCODE -ne 0) { throw 'Private build failed.' }
            Write-Output 'Windows build, local tests and extracted-package startup check passed.'
          } catch {
            Write-Error -ErrorAction Continue 'Windows packaging failed. Raw diagnostics are not public; encrypted diagnostics are retained.'
            exit 1
          } finally {
            $env:GITHUB_SHA = $workflowSha
            $evidence = Join-Path $env:RUNNER_TEMP 'mcl-ci-evidence-dynamic'
            if (Test-Path $evidence) { Copy-Item $evidence (Join-Path $logs 'ctest') -Recurse }
          }

      - name: Save verified public Windows archives even if later tests fail
        if: always() && steps.windows-archives.outputs.cache-hit != 'true' && steps.windows-package.outputs.toolchain_verified == 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mcl-ci-archives
          key: windows-2022-native-archives-${{ hashFiles('source/qt-native/ci/toolchain-lock.json') }}

      - name: Save only the four verified public Qt source archives
        if: always() && steps.qt-source-archives.outputs.cache-hit != 'true' && steps.windows-package.outputs.legal_archives_verified == 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            source/qt-native/.tools/downloads/qtbase-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtdeclarative-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtsvg-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtimageformats-everywhere-src-6.8.3.zip
          # Locked archive identities are stable across checkout line endings.
          key: qt-6.8.3-public-source-archives-a32f9f88e9c283c326cb94a3c1006ebdaf817d20a471da555995ae051a17fa44

          enableCrossOsArchive: true

      - name: Encrypt private diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          PLATFORM_NAME: windows-x64
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-build-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          $out = Join-Path $env:RUNNER_TEMP ('diagnostics-' + $env:PLATFORM_NAME + '.p7m')
          if (Test-Path builder/.github/scripts/encrypt-diagnostics.py) {
            python builder/.github/scripts/encrypt-diagnostics.py --certificate builder/.github/scripts/diagnostics-certificate.pem --logs-dir $logs --output $out --exclude-screenshots
            if ($LASTEXITCODE -ne 0) { throw 'Diagnostics encryption failed; raw files will not be uploaded.' }
          }

      - name: Retain encrypted diagnostics only
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-diagnostics-windows-x64
          path: ${{ runner.temp }}/diagnostics-windows-x64.p7m
          if-no-files-found: ignore
          retention-days: 3

      - name: Retain final runtime package only
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-x64
          path: ${{ runner.temp }}/release-assets/LittleCraftLauncher-${{ inputs.tag }}-windows-x64.*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Retain matching public Qt dependency sources
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-qt-dependency-sources
          path: source/qt-native/.tools/downloads/*-everywhere-src-6.8.3.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  build-linux:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.platform == 'both' || inputs.platform == 'linux' || !inputs.platform)
    name: Build linux-x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout public packaging tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: builder
          persist-credentials: false

      - name: Prepare private source and verify release inputs
        uses: ./builder/.github/actions/prepare-source
        with:
          source_repository: ${{ secrets.SOURCE_REPOSITORY }}
          source_read_token: ${{ secrets.SOURCE_READ_TOKEN }}
          tag: ${{ inputs.tag }}
          source_ref: ${{ inputs.source_ref }}

      - name: Restore the four pinned public Qt source archives
        id: qt-source-archives
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            source/qt-native/.tools/downloads/qtbase-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtdeclarative-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtsvg-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtimageformats-everywhere-src-6.8.3.zip
          key: qt-6.8.3-public-source-archives-a32f9f88e9c283c326cb94a3c1006ebdaf817d20a471da555995ae051a17fa44
          enableCrossOsArchive: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libegl1 libopengl0 libfontconfig1 libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-randr0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xkb1 libxrender1 libdbus-1-3 libssl3 fonts-noto-cjk xvfb xauth

      - name: Pin Linux Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'

      - name: Cache public Linux Qt SDK only
        id: linux-qt
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/qt-linux
          key: linux-x86_64-qt-6.8.3-gcc64-runtime-modules-v2

      - name: Install Linux Qt 6.8.3
        if: steps.linux-qt.outputs.cache-hit != 'true'
        run: |
          # No restore-prefix fallback is used. Retain an unexpected partial
          # SDK instead of silently mixing it with a fresh installation.
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sdk = Path(os.environ['RUNNER_TEMP']) / 'qt-linux'
          if sdk.exists() and (not sdk.is_dir() or any(sdk.iterdir())):
              sys.exit('Unexpected partial public SDK retained; installation stopped.')
          PY
          python -m pip install 'aqtinstall==3.3.0'
          # QtSvg is part of the base Qt 6.8.3 archive set, not an addon module.
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtimageformats --archives qtbase qtdeclarative qtsvg icu -O "$RUNNER_TEMP/qt-linux"

      - name: Verify public Linux SDK version and required modules
        run: |
          python builder/.github/scripts/verify-cache-inputs.py --kind linux-qt-sdk --qt-root "$RUNNER_TEMP/qt-linux/6.8.3/gcc_64"

      - name: Save the public Linux SDK before building private code
        if: steps.linux-qt.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/qt-linux
          key: linux-x86_64-qt-6.8.3-gcc64-runtime-modules-v2

      - name: Build, test and package Linux privately
        id: linux-package
        env:
          VERSION_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/private-build-logs"
          if ! bash -euo pipefail > "$RUNNER_TEMP/private-build-logs/linux-build.log" 2>&1 <<'BUILD'
            build_jobs="$(getconf _NPROCESSORS_ONLN)"
            if test "$build_jobs" -gt 4; then build_jobs=4; fi
            qt_root="$RUNNER_TEMP/qt-linux/6.8.3/gcc_64"
            test "$("$qt_root/bin/qmake" -query QT_VERSION)" = '6.8.3'
            export LD_LIBRARY_PATH="$qt_root/lib"
            export QT_PLUGIN_PATH="$qt_root/plugins"
            export QML_IMPORT_PATH="$qt_root/qml"
            export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QML_DISABLE_DISK_CACHE=1
            # PowerShell must not consume the remaining Bash here-document as
            # pipeline input. Verify the legal inputs before an expensive build.
            pwsh -NoLogo -NoProfile -NonInteractive -File source/qt-native/scripts/fetch-qt-license-sources.ps1 -Run </dev/null
            python builder/.github/scripts/verify-cache-inputs.py --kind qt-source-archives --source-root "$GITHUB_WORKSPACE/source"
            echo 'legal_archives_verified=true' >> "$GITHUB_OUTPUT"
            cmake -S source/qt-native -B "$RUNNER_TEMP/build-linux" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DMCL_STATIC_RELEASE=OFF \
              -DMCL_DISTRIBUTION_BUILD=OFF -DCMAKE_PREFIX_PATH="$qt_root"
            cmake --build "$RUNNER_TEMP/build-linux" --target mclauncher-qt --parallel "$build_jobs"
            python builder/.github/scripts/package-linux.py --source-root "$GITHUB_WORKSPACE/source" \
              --build-dir "$RUNNER_TEMP/build-linux" --qt-root "$qt_root" \
              --output-dir "$RUNNER_TEMP/release-assets" --tag "$VERSION_TAG"
            if ! python builder/.github/scripts/smoke-linux.py \
              --archive "$RUNNER_TEMP/release-assets/LittleCraftLauncher-$VERSION_TAG-linux-x86_64.tar.gz"; then
              runtime_archive="$RUNNER_TEMP/release-assets/LittleCraftLauncher-$VERSION_TAG-linux-x86_64.tar.gz"
              if test "$(stat -c %s "$runtime_archive")" -le 104857600; then
                cp "$runtime_archive" "$RUNNER_TEMP/private-build-logs/runtime-package.tar.gz"
              fi
              exit 1
            fi
            # The already-packaged application stays in the same build tree.
            # Upload remains gated on every local test passing afterwards.
            cmake --build "$RUNNER_TEMP/build-linux" --parallel "$build_jobs"
            ctest --test-dir "$RUNNER_TEMP/build-linux" --output-on-failure --no-tests=error --parallel 2
          BUILD
          then
            echo '::error::Linux packaging failed. Raw diagnostics are not public; encrypted diagnostics are retained.'
            exit 1
          fi
          echo 'Linux build, local tests and extracted-package startup check passed.'

      - name: Save only the four verified public Qt source archives
        if: always() && steps.qt-source-archives.outputs.cache-hit != 'true' && steps.linux-package.outputs.legal_archives_verified == 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            source/qt-native/.tools/downloads/qtbase-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtdeclarative-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtsvg-everywhere-src-6.8.3.zip
            source/qt-native/.tools/downloads/qtimageformats-everywhere-src-6.8.3.zip
          key: qt-6.8.3-public-source-archives-a32f9f88e9c283c326cb94a3c1006ebdaf817d20a471da555995ae051a17fa44
          enableCrossOsArchive: true

      - name: Encrypt private diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          PLATFORM_NAME: linux-x86_64
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-build-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          $out = Join-Path $env:RUNNER_TEMP ('diagnostics-' + $env:PLATFORM_NAME + '.p7m')
          if (Test-Path builder/.github/scripts/encrypt-diagnostics.py) {
            python builder/.github/scripts/encrypt-diagnostics.py --certificate builder/.github/scripts/diagnostics-certificate.pem --logs-dir $logs --output $out --exclude-screenshots
            if ($LASTEXITCODE -ne 0) { throw 'Diagnostics encryption failed; raw files will not be uploaded.' }
          }

      - name: Retain encrypted diagnostics only
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-diagnostics-linux-x86_64
          path: ${{ runner.temp }}/diagnostics-linux-x86_64.p7m
          if-no-files-found: ignore
          retention-days: 3

      - name: Retain final runtime package only
        if: ${{ !cancelled() && steps.linux-package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-x86_64
          path: ${{ runner.temp }}/release-assets/LittleCraftLauncher-${{ inputs.tag }}-linux-x86_64.*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    name: Publish both platforms as a prerelease
    needs: [build-windows, build-linux]
    if: always() && (inputs.platform == 'both' || !inputs.platform) && needs.build-windows.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download only the runtime packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create checksums and publish a preview
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.tag }}
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          win="LittleCraftLauncher-$VERSION_TAG-windows-x64.zip"
          linux="LittleCraftLauncher-$VERSION_TAG-linux-x86_64.tar.gz"
          test -s "$win" && test -s "$linux"
          qt_sources=(qtbase-everywhere-src-6.8.3.zip qtdeclarative-everywhere-src-6.8.3.zip qtsvg-everywhere-src-6.8.3.zip qtimageformats-everywhere-src-6.8.3.zip)
          for archive in "${qt_sources[@]}"; do test -s "$archive"; done
          sha256sum "$win" "$linux" "${qt_sources[@]}" > SHA256SUMS.txt
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          这是用于测试的预发布版本，不是正式版。启动器源码继续保持私有。

          - **Windows x64**：下载 Windows ZIP，完整解压后运行 `mclauncher-qt.exe`。运行库随包提供，请勿只拷贝 EXE。程序尚未签名。
          - **Linux x86_64（Ubuntu 22.04 及更新兼容环境）**：下载并解压 `.tar.gz`，运行其中的 `./LittleCraftLauncher`。这是界面与本地功能的实验预览；游戏依赖解析仍有 Windows 专用逻辑，在线登录的凭据保护和托管 Java 下载尚未完成 Linux 适配，不能视为可正常启动游戏的 Linux 版本。
          - 本版本未内置项目授权的 Microsoft Client ID，微软登录仍需后续配置；LittleSkin 使用已配置的公共客户端 ID。
          - 下载后可用 `SHA256SUMS.txt` 校验文件。Qt 动态库、许可证、依赖材料获取入口及替换说明随包提供在 `SUPPORTING_MATERIALS.zip`。
          - 另外四个 `qt*-everywhere-src-6.8.3.zip` 是对应 Qt 开源依赖的官方源码归档，仅供查阅或替换依赖；使用启动器无需下载它们，也不包含启动器源码。
          - CI 执行本地回归与解压后程序启动检查；不代表完成真实账号认证、Minecraft 游戏或各发行版兼容性验收。

          GitHub 自动生成的 “Source code” 压缩包只包含此公开发布仓库的介绍和构建工具，不包含启动器源码。
          NOTES
          gh release create "$VERSION_TAG" "$win" "$linux" "${qt_sources[@]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Little Craft Launcher $VERSION_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft --prerelease --latest=false
          gh release edit "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

      - name: Checkout public artifact cleanup tools
        id: cleanup-tools
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: cleanup-tools
          persist-credentials: false

      - name: Remove temporary packages after verifying the published prerelease
        if: success() && steps.cleanup-tools.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.tag }}
        run: |
          python3 cleanup-tools/.github/scripts/prune-published-artifacts.py \
            --repository "$GITHUB_REPOSITORY" --tag "$VERSION_TAG" --run-id "$GITHUB_RUN_ID"
