# Android client (preview): host tests and an arm64-v8a debug APK built from
# the private source. Uses the same Actions secrets as the Windows build:
#   SOURCE_REPOSITORY: owner/private-repo (never put a token in this value)
#   SOURCE_READ_TOKEN: fine-grained PAT, only that repo, Contents: read
# Logs and artifacts of a public repo are public. The APK is uploaded only when
# upload_apk is selected; private build/test output is retained only as encrypted
# diagnostics, never as plaintext artifacts or public step output.
#
# With release_tag the same job builds the release variant under that version.
# The prerelease workflow calls it that way and attaches the result to the
# release when it is signed with the project's own key, held in the secrets:
#   ANDROID_KEYSTORE_BASE64: base64 of the keystore file
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD: optional, when it differs from the keystore password
# Without them the release variant is still built and checked, but it stays
# unsigned and is neither uploaded nor published: a package signed with a
# public debug key could be replaced by anyone and could not be updated later.
name: Android build
run-name: Build Android client ${{ inputs.source_ref || 'master' }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full 40-character private-source commit SHA (empty: master)'
        type: string
        required: false
        default: ''
      upload_apk:
        description: 'Upload the debug APK as a 7-day artifact (public in this repository)'
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'Rehearse a release build under this version, e.g. v1.0.0-pre.16 (publishes nothing)'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      source_ref:
        description: 'Full private-source commit SHA'
        type: string
        required: false
        default: ''
      source_tag:
        description: 'Private-source tag, used when no commit is given'
        type: string
        required: false
        default: ''
      release_tag:
        description: 'Version to build the release variant for'
        type: string
        required: false
        default: ''
      upload_apk:
        type: boolean
        required: false
        default: false
    outputs:
      signed:
        description: 'true when a signed release package was uploaded'
        value: ${{ jobs.build.outputs.signed }}

permissions:
  contents: read
  actions: read

concurrency:
  # A release build must not be cancelled by, or cancel, a manual build.
  group: private-source-android-${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  AQTINSTALL_VERSION: '3.3.0'
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_BUILD_TOOLS: '35.0.1'
  ANDROID_PLATFORM: 'android-35'
  # KDAB/android_openssl master on 2026-11-13 (OpenSSL 3 prebuilt for Android).
  ANDROID_OPENSSL_COMMIT: 'b71f1470962019bd89534a2919f5925f93bc5779'

jobs:
  build:
    name: Android host tests and debug APK
    # Do not give source credentials to workflows from PRs or alternate refs.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      signed: ${{ steps.runtime.outputs.signed }}
    steps:
      - name: Checkout public diagnostic tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: builder
          persist-credentials: false

      - name: Validate configuration
        env:
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_REPOSITORY}" ] || [ -z "${SOURCE_READ_TOKEN}" ]; then
            echo '::error::Configure SOURCE_REPOSITORY and SOURCE_READ_TOKEN in this repository Actions secrets.'; exit 1
          fi
          if ! printf '%s' "${SOURCE_REPOSITORY}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$'; then
            echo '::error::SOURCE_REPOSITORY must be owner/repo, without a URL or credentials.'; exit 1
          fi
          if [ -n "${SOURCE_REF}" ] && ! printf '%s' "${SOURCE_REF}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo '::error::source_ref must be a full 40-character commit SHA.'; exit 1
          fi
          if [ -n "${SOURCE_TAG}" ] && [ "${SOURCE_TAG}" != "${RELEASE_TAG}" ]; then
            echo '::error::source_tag may only name the release being built.'; exit 1
          fi
          if [ -n "${RELEASE_TAG}" ]; then
            # Also validates the version; prints "<package> <version name> <version code>".
            if ! identity="$(python3 builder/.github/scripts/android_release.py version --tag "${RELEASE_TAG}")"; then
              echo '::error::release_tag must be a prerelease version such as v1.0.0-pre.16.'; exit 1
            fi
            read -r package version_name version_code <<<"${identity}"
            {
              echo 'BUILD_VARIANT=release'
              echo "RELEASE_TAG=${RELEASE_TAG}"
              echo "RELEASE_PACKAGE=${package}"
              echo "RELEASE_VERSION_NAME=${version_name}"
              echo "RELEASE_VERSION_CODE=${version_code}"
            } >> "${GITHUB_ENV}"
          fi
          # GitHub masks the complete secret; also mask its parts and casing.
          lower="$(printf '%s' "${SOURCE_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          for value in "${SOURCE_REPOSITORY}" "${lower}" "${SOURCE_REPOSITORY%%/*}" "${SOURCE_REPOSITORY#*/}" "${lower%%/*}" "${lower#*/}"; do
            echo "::add-mask::${value}"
          done

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          ref: ${{ inputs.source_ref || inputs.source_tag || 'master' }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          submodules: false
          lfs: false

      - name: Verify source layout
        run: |
          set -euo pipefail
          for relative in qt-native/cmake/AndroidPreview.cmake qt-native/scripts/build-android-preview.py \
                          qt-native/src/android/android_launcher.cpp qt-native/tests/android_launcher_tests.cpp; do
            if [ ! -f "source/${relative}" ]; then
              echo '::error::The selected source revision does not contain the Android client inputs.'; exit 1
            fi
          done
          echo "Source revision: $(git -C source rev-parse HEAD)"

      - name: Install build tools and pinned Qt kits
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev > /dev/null
          python3 -m pip install --user --quiet "aqtinstall==${AQTINSTALL_VERSION}"
          python3 -m aqt install-qt linux android "${QT_VERSION}" android_arm64_v8a --autodesktop -O "${RUNNER_TEMP}/Qt"
          test -f "${RUNNER_TEMP}/Qt/${QT_VERSION}/gcc_64/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "${RUNNER_TEMP}/Qt/${QT_VERSION}/android_arm64_v8a/lib/cmake/Qt6/Qt6Config.cmake"

      - name: Install pinned Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${sdkmanager}" --licenses > /dev/null || true
          "${sdkmanager}" --install "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools" "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

      - name: Fetch pinned Android OpenSSL
        run: |
          set -euo pipefail
          git init -q "${RUNNER_TEMP}/android_openssl"
          git -C "${RUNNER_TEMP}/android_openssl" fetch -q --depth 1 https://github.com/KDAB/android_openssl.git "${ANDROID_OPENSSL_COMMIT}"
          git -C "${RUNNER_TEMP}/android_openssl" checkout -q FETCH_HEAD

      - name: Build and run host client tests
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/private-build-logs"
          if ! bash -euo pipefail > "${RUNNER_TEMP}/private-build-logs/android-host.log" 2>&1 <<'HOST'
            cmake -S source/qt-native -B "${RUNNER_TEMP}/android-host" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DMCL_ANDROID_PREVIEW=ON -DBUILD_TESTING=ON -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/Qt/${QT_VERSION}/gcc_64"
            cmake --build "${RUNNER_TEMP}/android-host" --parallel 4
            ctest --test-dir "${RUNNER_TEMP}/android-host" --output-on-failure --no-tests=error
          HOST
          then
            echo '::error::Android host tests failed. Private diagnostics are retained encrypted.'
            exit 1
          fi
          echo 'Android host client tests passed.'

      - name: Build debug APK
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/private-build-logs"
          if ! bash -euo pipefail > "${RUNNER_TEMP}/private-build-logs/android-apk.log" 2>&1 <<'APK'
            # A release uses optimized native code; that host package is unsigned.
            build_type=Debug
            pattern='*debug*'
            if [ "${BUILD_VARIANT:-debug}" = release ] \
                && grep -q -- '--build-type' source/qt-native/scripts/build-android-preview.py; then
              build_type=Release
              pattern='*'
            fi
            python3 source/qt-native/scripts/build-android-preview.py --build \
              --build-dir "${RUNNER_TEMP}/android-apk" \
              --qt "${RUNNER_TEMP}/Qt/${QT_VERSION}/android_arm64_v8a" \
              --host-qt "${RUNNER_TEMP}/Qt/${QT_VERSION}/gcc_64" \
              --sdk "${ANDROID_SDK_ROOT}" \
              --ndk "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" \
              --jdk "${JAVA_HOME_17_X64}" \
              --openssl "${RUNNER_TEMP}/android_openssl" \
              $([ "${build_type}" = Release ] && echo '--build-type Release')
            apk="$(find "${RUNNER_TEMP}/android-apk" -name '*.apk' -path "${pattern}" | head -n 1)"
            if [ -z "${apk}" ]; then echo 'No host APK was produced.'; exit 1; fi
            mkdir -p "${RUNNER_TEMP}/apk-out"
            revision="$(git -C source rev-parse --short=12 HEAD)"
            out="${RUNNER_TEMP}/apk-out/LittleCraft-android-${revision}-arm64-v8a-debug.apk"
            cp "${apk}" "${out}"
            # Require both TLS libraries, not just one matching grep line.
            for library in ssl crypto; do
              unzip -Z1 "${out}" | grep -Fx "lib/arm64-v8a/lib${library}_3.so" > /dev/null
            done
            {
              echo '### Android debug APK'
              echo "- Source revision: \`${revision}\`"
              echo "- Size: $(stat -c %s "${out}") bytes"
              echo "- SHA-256: \`$(sha256sum "${out}" | cut -d' ' -f1)\`"
              echo "- Uploaded: ${{ inputs.upload_apk }}"
            } >> "${GITHUB_STEP_SUMMARY}"
          APK
          then
            echo '::error::Android APK build or validation failed. Private diagnostics are retained encrypted.'
            exit 1
          fi
          echo 'Android debug APK built and validated.'

      # The game runtime is the public LGPL component on the android-runtime
      # branch: a pinned upstream Amethyst commit plus patches. It contains no
      # private source, so its build output is logged normally. It packages the
      # Qt application directory prepared above into one APK.
      - name: Fetch pinned game runtime
        run: |
          set -euo pipefail
          git init -q definition
          git -C definition fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" android-runtime
          git -C definition checkout -q FETCH_HEAD
          . definition/UPSTREAM
          printf '%s' "${UPSTREAM_COMMIT}" | grep -Eq '^[0-9a-f]{40}$'
          git init -q runtime && cd runtime
          git fetch -q --depth 1 "${UPSTREAM_REPOSITORY}" "${UPSTREAM_COMMIT}"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git config user.name runtime-build && git config user.email runtime-build@invalid
          shopt -s nullglob
          for patch in ../definition/patches/*.patch; do git am -q "${patch}"; done
          echo "RUNTIME_DEFINITION=$(git -C ../definition rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Set up JDK 21 for the runtime
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Get JRE 8 (as upstream CI does)
        uses: dawidd6/action-download-artifact@07ab29fd4a977ae4d2b275087cf67563dfdf0295 # v9
        with:
          workflow: build.yml
          path: runtime/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Build the APK with the game runtime
        id: runtime
        working-directory: runtime
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo 'signed=false' >> "${GITHUB_OUTPUT}"
          host="${RUNNER_TEMP}/android-apk/android-build"
          tools="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"
          test -f "${host}/gradle.properties"
          test -f "${host}/libs/arm64-v8a/libmcl-android_arm64-v8a.so"
          # One C++ runtime per process: use the newer one the game runtime builds.
          rm -f "${host}/libs/arm64-v8a/libc++_shared.so"
          revision="$(git -C ../source rev-parse --short=12 HEAD)"
          ./scripts/languagelist_updater.sh
          # Plain JVM tests of the Little Craft Launcher part of the runtime.
          gradle :app_pojavlauncher:testDebugUnitTest --tests 'net.kdt.pojavlaunch.lcl.*'
          if [ "${BUILD_VARIANT:-debug}" = release ]; then
            # Unsigned here; signed below with the project's own key only.
            gradle :app_pojavlauncher:assembleRelease -PlclUnsigned \
              "-PlclHostDir=${host}" -PlclQtLibName=mcl-android \
              "-PlclVersionName=${RELEASE_VERSION_NAME}" "-PlclVersionCode=${RELEASE_VERSION_CODE}"
            apk=app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release-unsigned.apk
          else
            gradle :app_pojavlauncher:assembleDebug \
              "-PlclHostDir=${host}" -PlclQtLibName=mcl-android \
              "-PlclVersionName=0.3.0-preview+${revision}" "-PlclVersionCode=${GITHUB_RUN_NUMBER}"
            apk=app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          fi
          test -f "${apk}"
          for entry in lib/arm64-v8a/libmcl-android_arm64-v8a.so lib/arm64-v8a/libpojavexec.so \
                       lib/arm64-v8a/libssl_3.so lib/arm64-v8a/libcrypto_3.so lib/arm64-v8a/libc++_shared.so \
                       assets/android_rcc_bundle.rcc; do
            unzip -Z1 "${apk}" | grep -Fx "${entry}" > /dev/null || { echo "::error::The APK is missing ${entry}"; exit 1; }
          done
          "${tools}/aapt2" dump xmltree "${apk}" --file AndroidManifest.xml > "${RUNNER_TEMP}/manifest.txt"
          grep -q 'org.qtproject.qt.android.bindings.QtActivity' "${RUNNER_TEMP}/manifest.txt"
          grep -q 'net.kdt.pojavlaunch.lcl.LclGameEntryActivity' "${RUNNER_TEMP}/manifest.txt"
          test "$(grep -c 'android.intent.category.LAUNCHER' "${RUNNER_TEMP}/manifest.txt")" = 1
          # The combined APK replaces the host-only one as the build result.
          rm -f "${RUNNER_TEMP}"/apk-out/*.apk
          if [ "${BUILD_VARIANT:-debug}" != release ]; then
            out="${RUNNER_TEMP}/apk-out/LittleCraft-android-${revision}-arm64-v8a-debug.apk"
            cp "${apk}" "${out}"
            {
              echo '### Android debug APK with game runtime'
              echo "- Runtime definition (android-runtime branch): \`${RUNTIME_DEFINITION}\`"
              echo "- Size: $(stat -c %s "${out}") bytes"
              echo "- SHA-256: \`$(sha256sum "${out}" | cut -d' ' -f1)\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # A published package must carry its version and must not be debuggable.
          "${tools}/aapt2" dump badging "${apk}" > "${RUNNER_TEMP}/badging.txt"
          grep -q "^package: name='org.littlecraftlauncher.android' versionCode='${RELEASE_VERSION_CODE}' versionName='${RELEASE_VERSION_NAME}'" "${RUNNER_TEMP}/badging.txt"
          if grep -q '^application-debuggable' "${RUNNER_TEMP}/badging.txt"; then
            echo '::error::The release package is debuggable.'; exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ]; then
            echo '::notice::The Android release package was built and checked but is not published: the signing secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS are not configured.'
            {
              echo '### Android release package (unsigned, not published)'
              echo "- Version: \`${RELEASE_VERSION_NAME}\` (code ${RELEASE_VERSION_CODE})"
              echo '- Configure the Android signing secrets to publish it with the next release.'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          umask 077
          keys="$(mktemp -d "${RUNNER_TEMP}/signing.XXXXXX")"
          trap 'rm -rf "${keys}"' EXIT
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode --ignore-garbage > "${keys}/release.keystore"
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD}}"
          mkdir -p "${RUNNER_TEMP}/release-out"
          out="${RUNNER_TEMP}/release-out/${RELEASE_PACKAGE}"
          # Tool output is discarded so that nothing about the key reaches the log.
          if ! "${tools}/apksigner" sign --ks "${keys}/release.keystore" --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --out "${out}" "${apk}" > /dev/null 2>&1; then
            echo '::error::Signing failed. Check the keystore, alias and passwords in the Android signing secrets.'; exit 1
          fi
          rm -f "${out}.idsig"
          "${tools}/apksigner" verify --min-sdk-version 29 --print-certs "${out}" > "${keys}/certificate.txt"
          if grep -qi 'CN=Android Debug' "${keys}/certificate.txt"; then
            echo '::error::The configured key is an Android debug key; a release needs its own key.'; exit 1
          fi
          test "$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' "${keys}/certificate.txt")" = 1
          certificate="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${keys}/certificate.txt")"
          python3 ../builder/.github/scripts/android_release.py describe --tag "${RELEASE_TAG}" \
            --apk "${out}" --certificate "${certificate}" --runtime-definition "${RUNTIME_DEFINITION}"
          {
            echo '### Android release package (signed)'
            echo "- Version: \`${RELEASE_VERSION_NAME}\` (code ${RELEASE_VERSION_CODE})"
            echo "- Runtime definition (android-runtime branch): \`${RUNTIME_DEFINITION}\`"
            echo "- Size: $(stat -c %s "${out}") bytes"
            echo "- SHA-256: \`$(sha256sum "${out}" | cut -d' ' -f1)\`"
            echo "- Signing certificate SHA-256: \`${certificate}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo 'signed=true' >> "${GITHUB_OUTPUT}"

      - name: Write safe CI summary (android)
        id: safe-diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SAFE_JOB_STATUS: ${{ job.status }}
        run: |
          python3 builder/.github/scripts/ci_safe_diagnostics.py create \
            --source-root "$GITHUB_WORKSPACE/source" \
            --logs-dir "$RUNNER_TEMP/private-build-logs" \
            --platform android --status "$SAFE_JOB_STATUS" \
            --output "$RUNNER_TEMP/safe-diagnostics/android/summary.json"

      - name: Retain safe CI summary (android)
        if: ${{ always() && steps.safe-diagnostics.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safe-diagnostics-android-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safe-diagnostics/android/summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Encrypt private Android diagnostics
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/private-build-logs"
          python3 builder/.github/scripts/encrypt-diagnostics.py \
            --certificate builder/.github/scripts/diagnostics-certificate.pem \
            --logs-dir "${RUNNER_TEMP}/private-build-logs" \
            --output "${RUNNER_TEMP}/diagnostics-android.p7m" --exclude-screenshots

      - name: Retain encrypted Android diagnostics only
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-diagnostics-android
          path: ${{ runner.temp }}/diagnostics-android.p7m
          if-no-files-found: ignore
          retention-days: 3

      # Not named release-*: the desktop publication collects those artifacts
      # and must keep seeing exactly its own two packages.
      - name: Upload signed release package
        if: success() && inputs.upload_apk && steps.runtime.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-package-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/release-out/*
          retention-days: 3
          if-no-files-found: error

      - name: Upload debug APK
        if: success() && inputs.upload_apk && !inputs.release_tag
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: little-craft-android-debug-${{ github.run_id }}
          path: ${{ runner.temp }}/apk-out/*.apk
          retention-days: 7
          if-no-files-found: error
