# Android client (preview): host tests and an arm64-v8a debug APK built from
# the private source. Uses the same Actions secrets as the Windows build:
#   SOURCE_REPOSITORY: owner/private-repo (never put a token in this value)
#   SOURCE_READ_TOKEN: fine-grained PAT, only that repo, Contents: read
# Logs and artifacts of a public repo are public. The APK is uploaded only when
# upload_apk is selected; test logs and source files are never uploaded.
name: Android build
run-name: Build Android client ${{ inputs.source_ref || 'master' }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full 40-character private-source commit SHA (empty: master)'
        type: string
        required: false
        default: ''
      upload_apk:
        description: 'Upload the debug APK as a 7-day artifact (public in this repository)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: private-source-android-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  AQTINSTALL_VERSION: '3.3.0'
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_BUILD_TOOLS: '35.0.1'
  ANDROID_PLATFORM: 'android-35'
  # KDAB/android_openssl master on 2026-11-13 (OpenSSL 3 prebuilt for Android).
  ANDROID_OPENSSL_COMMIT: 'b71f1470962019bd89534a2919f5925f93bc5779'

jobs:
  build:
    name: Android host tests and debug APK
    # Do not give source credentials to workflows from PRs or alternate refs.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Validate configuration
        env:
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_REPOSITORY}" ] || [ -z "${SOURCE_READ_TOKEN}" ]; then
            echo '::error::Configure SOURCE_REPOSITORY and SOURCE_READ_TOKEN in this repository Actions secrets.'; exit 1
          fi
          if ! printf '%s' "${SOURCE_REPOSITORY}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$'; then
            echo '::error::SOURCE_REPOSITORY must be owner/repo, without a URL or credentials.'; exit 1
          fi
          if [ -n "${SOURCE_REF}" ] && ! printf '%s' "${SOURCE_REF}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo '::error::source_ref must be a full 40-character commit SHA.'; exit 1
          fi
          # GitHub masks the complete secret; also mask its parts and casing.
          lower="$(printf '%s' "${SOURCE_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          for value in "${SOURCE_REPOSITORY}" "${lower}" "${SOURCE_REPOSITORY%%/*}" "${SOURCE_REPOSITORY#*/}" "${lower%%/*}" "${lower#*/}"; do
            echo "::add-mask::${value}"
          done

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          ref: ${{ inputs.source_ref || 'master' }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          submodules: false
          lfs: false

      - name: Verify source layout
        run: |
          set -euo pipefail
          for relative in qt-native/cmake/AndroidPreview.cmake qt-native/scripts/build-android-preview.py \
                          qt-native/src/android/android_launcher.cpp qt-native/tests/android_launcher_tests.cpp; do
            if [ ! -f "source/${relative}" ]; then
              echo '::error::The selected source revision does not contain the Android client inputs.'; exit 1
            fi
          done
          echo "Source revision: $(git -C source rev-parse HEAD)"

      - name: Install build tools and pinned Qt kits
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev > /dev/null
          python3 -m pip install --user --quiet "aqtinstall==${AQTINSTALL_VERSION}"
          python3 -m aqt install-qt linux android "${QT_VERSION}" android_arm64_v8a --autodesktop -O "${RUNNER_TEMP}/Qt"
          test -f "${RUNNER_TEMP}/Qt/${QT_VERSION}/gcc_64/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "${RUNNER_TEMP}/Qt/${QT_VERSION}/android_arm64_v8a/lib/cmake/Qt6/Qt6Config.cmake"

      - name: Install pinned Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${sdkmanager}" --licenses > /dev/null || true
          "${sdkmanager}" --install "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools" "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

      - name: Fetch pinned Android OpenSSL
        run: |
          set -euo pipefail
          git init -q "${RUNNER_TEMP}/android_openssl"
          git -C "${RUNNER_TEMP}/android_openssl" fetch -q --depth 1 https://github.com/KDAB/android_openssl.git "${ANDROID_OPENSSL_COMMIT}"
          git -C "${RUNNER_TEMP}/android_openssl" checkout -q FETCH_HEAD

      - name: Build and run host client tests
        run: |
          set -euo pipefail
          cmake -S source/qt-native -B "${RUNNER_TEMP}/android-host" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMCL_ANDROID_PREVIEW=ON -DBUILD_TESTING=ON -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/Qt/${QT_VERSION}/gcc_64"
          cmake --build "${RUNNER_TEMP}/android-host" --parallel 4
          ctest --test-dir "${RUNNER_TEMP}/android-host" --output-on-failure

      - name: Build debug APK
        run: |
          set -euo pipefail
          python3 source/qt-native/scripts/build-android-preview.py --build \
            --build-dir "${RUNNER_TEMP}/android-apk" \
            --qt "${RUNNER_TEMP}/Qt/${QT_VERSION}/android_arm64_v8a" \
            --host-qt "${RUNNER_TEMP}/Qt/${QT_VERSION}/gcc_64" \
            --sdk "${ANDROID_SDK_ROOT}" \
            --ndk "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" \
            --jdk "${JAVA_HOME_17_X64}" \
            --openssl "${RUNNER_TEMP}/android_openssl"
          apk="$(find "${RUNNER_TEMP}/android-apk" -name '*.apk' -path '*debug*' | head -n 1)"
          if [ -z "${apk}" ]; then echo '::error::No debug APK was produced.'; exit 1; fi
          mkdir -p "${RUNNER_TEMP}/apk-out"
          revision="$(git -C source rev-parse --short=12 HEAD)"
          out="${RUNNER_TEMP}/apk-out/LittleCraft-android-${revision}-arm64-v8a-debug.apk"
          cp "${apk}" "${out}"
          # The APK must carry the TLS libraries; without them no download works.
          unzip -l "${out}" | grep -E 'lib/arm64-v8a/lib(ssl|crypto)_3\.so' || { echo '::error::OpenSSL libraries are missing from the APK.'; exit 1; }
          {
            echo '### Android debug APK'
            echo "- Source revision: \`${revision}\`"
            echo "- Size: $(stat -c %s "${out}") bytes"
            echo "- SHA-256: \`$(sha256sum "${out}" | cut -d' ' -f1)\`"
            echo "- Uploaded: ${{ inputs.upload_apk }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload debug APK
        if: inputs.upload_apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: little-craft-android-debug-${{ github.run_id }}
          path: ${{ runner.temp }}/apk-out/*.apk
          retention-days: 7
          if-no-files-found: error
