name: Diagnose private Windows UI
run-name: Diagnose ${{ inputs.profile || 'legacy' }} Windows UI ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing private prerelease source tag'
        required: true
        type: string
        default: v1.0.0-pre.2
      profile:
        description: 'Legacy font investigation or repeated native Windows control checks'
        required: false
        type: choice
        options: [legacy, native-controls]
        default: legacy
      source_ref:
        description: 'Optional full commit SHA containing reviewed test-only fixes'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: diagnose-windows-ui
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout public diagnostic tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: builder
          persist-credentials: false

      - name: Prepare private source and verify release inputs
        uses: ./builder/.github/actions/prepare-source
        with:
          source_repository: ${{ secrets.SOURCE_REPOSITORY }}
          source_read_token: ${{ secrets.SOURCE_READ_TOKEN }}
          tag: ${{ inputs.tag }}
          source_ref: ${{ inputs.source_ref }}

      - name: Cache verified public Windows toolchain archives
        id: windows-archives
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mcl-ci-archives
          key: windows-2022-native-archives-${{ hashFiles('source/qt-native/ci/toolchain-lock.json') }}

      - name: Build the selected diagnostic and collect private QtTest output
        id: diagnostic
        shell: pwsh
        env:
          DIAGNOSTIC_PROFILE: ${{ inputs.profile || 'legacy' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-native-ui-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          & pwsh -NoLogo -NoProfile -NonInteractive -File builder/.github/scripts/diagnose-windows-ui.ps1 `
            -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'source') `
            -PrivateLogDirectory $logs -Profile $env:DIAGNOSTIC_PROFILE *> (Join-Path $logs 'orchestrator.log')
          if ($LASTEXITCODE -ne 0) {
            Write-Error -ErrorAction Continue 'Windows UI diagnostic failed. Detailed text logs remain private and are retained encrypted.'
            exit 1
          }
          Write-Output 'The selected Windows UI diagnostic passed; it is not a full release gate and publishes no binaries.'

      - name: Save only verified public toolchain archives
        if: always() && steps.windows-archives.outputs.cache-hit != 'true' && steps.diagnostic.outputs.toolchain_verified == 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mcl-ci-archives
          key: windows-2022-native-archives-${{ hashFiles('source/qt-native/ci/toolchain-lock.json') }}

      - name: Encrypt diagnostic output
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'private-native-ui-logs'
          $null = New-Item -ItemType Directory -Path $logs -Force
          if (Test-Path builder/.github/scripts/encrypt-diagnostics.py) {
            python builder/.github/scripts/encrypt-diagnostics.py `
              --certificate builder/.github/scripts/diagnostics-certificate.pem `
              --logs-dir $logs --output (Join-Path $env:RUNNER_TEMP 'native-ui-diagnostics.p7m') --exclude-screenshots
            if ($LASTEXITCODE -ne 0) { throw 'Diagnostic encryption failed. No raw files will be uploaded.' }
          }

      - name: Retain encrypted diagnostic only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-native-ui-diagnostics
          path: ${{ runner.temp }}/native-ui-diagnostics.p7m
          if-no-files-found: ignore
          retention-days: 3
